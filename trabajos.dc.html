<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trabajos — Blacktrama</title>
<meta name="description" content="Blacktrama diseña webs y productos digitales tejidos con claridad y carácter.">
<script src="./js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,200..900;1,75..125,200..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#0c0c0b;color:#ece8e1;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#ece8e1;text-decoration:none}
a:hover{color:#ffd60a}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
html.bt-in body::after{content:"";position:fixed;inset:0;z-index:99999;pointer-events:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html.bt-busy,html.bt-busy *{cursor:none!important}
@keyframes bt-grain{0%{transform:translate(0,0)}17%{transform:translate(-3%,2%)}33%{transform:translate(2%,-4%)}50%{transform:translate(-4%,-1%)}67%{transform:translate(3%,3%)}83%{transform:translate(-1%,4%)}100%{transform:translate(0,0)}}
</style>
<script>try{if(sessionStorage.getItem('bt-nav')){sessionStorage.removeItem('bt-nav');document.documentElement.classList.add('bt-in');}}catch(e){}</script>
</helmet>
<div data-screen-label="01 Trabajos" style="position:relative;background:#0c0c0b;color:#ece8e1;font-family:'Mona Sans',Helvetica,Arial,sans-serif">
  <div style="{{ headStyle }}">
    <div style="height:clamp(64px,4.6vw,88px);display:flex;align-items:center;justify-content:space-between">
      <a href="index.dc.html" style="font-size:clamp(17px,1.15vw,22px);font-weight:500;letter-spacing:-0.02em;color:#ece8e1">Blacktrama</a>
      <nav style="display:flex;gap:clamp(20px,2.1vw,40px);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:clamp(11px,0.63vw,12px);letter-spacing:0.08em;text-transform:uppercase">
        <a href="trabajos.dc.html" style="color:#ece8e1;padding:6px 0;border-bottom:1px solid #ece8e1" style-hover="color:#ffd60a;border-bottom-color:#ffd60a">Trabajo</a>
        <a href="contacto.dc.html" style="color:#8a8780;padding:6px 0;border-bottom:1px solid transparent" style-hover="color:#ece8e1">Contacto</a>
      </nav>
    </div>
    <div style="display:flex;gap:24px;font-size:clamp(14px,0.78vw,15px)">
      <button type="button" onClick="{{ toProyectos }}" style="background:none;border:0;border-bottom:1px solid {{ projLine }};padding:0 0 6px;font:inherit;color:{{ projColor }};cursor:pointer">Proyectos</button>
      <button type="button" onClick="{{ toLista }}" style="background:none;border:0;border-bottom:1px solid {{ listLine }};padding:0 0 6px;font:inherit;color:{{ listColor }};cursor:pointer">Lista</button>
    </div>
  </div>

  <div ref="{{ contentRef }}">
    <sc-if value="{{ isProyectos }}" hint-placeholder-val="{{ true }}">
      <div ref="{{ trackRef }}" data-track="" style="position:relative;height:{{ trackH }};margin-top:-128px">
        <div style="position:sticky;top:0;height:100svh;overflow:hidden">
          <div ref="{{ metasRef }}" style="{{ metaBox }}">
            <sc-for list="{{ projects }}" as="pj" hint-placeholder-count="1">
              <div data-meta="" style="position:absolute;left:0;top:0;white-space:nowrap;opacity:0">{{ pj.meta }}</div>
            </sc-for>
          </div>
          <div ref="{{ namesRef }}" data-names="" style="position:absolute;left:0;right:0;bottom:clamp(8px,1.2vw,24px);height:1em;overflow:hidden;font-size:clamp(56px,14vw,360px);z-index:1">
            <sc-for list="{{ projects }}" as="pj" hint-placeholder-count="1">
              <div data-name="" style="visibility:hidden;position:absolute;top:0;left:50%;transform:translateX(-50%);width:max-content;display:flex;white-space:nowrap;line-height:1;letter-spacing:-0.04em;font-weight:400;color:#ece8e1">
                <sc-for list="{{ pj.letters }}" as="ch">
                  <span style="display:inline-block;will-change:transform">{{ ch }}</span>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <div ref="{{ cardsRef }}" data-cardbox="" onMouseEnter="{{ cardEnter }}" onMouseLeave="{{ cardLeave }}" onClick="{{ cardClick }}" style="{{ cardBox }}">
            <sc-for list="{{ projects }}" as="pj" hint-placeholder-count="1">
              <div data-card="" style="visibility:hidden;position:absolute;inset:0;background:{{ pj.tone }};will-change:transform"></div>
            </sc-for>
          </div>
          <div style="{{ countBox }}"><span ref="{{ countRef }}">01</span> / {{ total }}</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isLista }}" hint-placeholder-val="{{ false }}">
      <div ref="{{ listRef }}" onMouseLeave="{{ listLeave }}" style="padding:clamp(96px,10.2vw,196px) clamp(16px,1.67vw,32px) clamp(120px,10vw,200px)">
        <div style="border-bottom:1px solid #2a2a28">
          <sc-for list="{{ projects }}" as="pj" hint-placeholder-count="8">
            <a href="{{ pj.href }}" data-row="" onMouseEnter="{{ pj.enter }}" style="{{ rowStyle }}" style-hover="color:#ece8e1">
              <span style="font-size:clamp(30px,2.75vw,56px);line-height:1.1;letter-spacing:-0.025em">{{ pj.name }}</span>
              <span style="font-size:clamp(14px,0.89vw,17px);color:#8a8780">{{ pj.cat }}</span>
              <span style="font-size:clamp(14px,0.89vw,17px);color:#8a8780;text-align:right">{{ pj.year }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <div ref="{{ cursorRef }}" aria-hidden="true" style="position:fixed;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:#ece8e1;color:#0c0c0b;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;transform:translate3d(-200px,-200px,0) scale(0)"><i class="ph ph-arrow-up-right" style="font-size:22px;line-height:1"></i></div>
  <div ref="{{ previewRef }}" aria-hidden="true" style="position:fixed;left:0;top:0;width:clamp(200px,16vw,300px);aspect-ratio:3 / 4;background:#3a3a39;pointer-events:none;z-index:40;transform:translate3d(-400px,-400px,0) scale(0)"></div>
  {{ vintage }}
</div>

<footer data-screen-label="02 Footer" ref="{{ footRef }}" style="position:relative;display:flex;flex-direction:column;min-height:clamp(0px,(100vw - 767px) * 9999,100svh);max-height:max(100svh,(1023px - 100vw) * 9999);background:#ece8e1;color:#0c0c0b;font-family:'Mona Sans',Helvetica,Arial,sans-serif">
  <div style="{{ footGrid }}">
    <div data-line="x" aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:#e3dfd7;pointer-events:none;overflow:hidden"><div data-draw="" style="position:absolute;inset:0;background:#0c0c0b;opacity:0.55"></div></div>
    <div style="{{ footLeft }}">
      <div style="display:flex;flex-direction:column;gap:clamp(12px,1vw,20px)">
        <a href="mailto:hola@blacktrama.studio" style="color:#0c0c0b;font-size:clamp(26px,2.5vw,48px);line-height:1.1;letter-spacing:-0.02em;overflow-wrap:anywhere" style-hover="color:#6b6862">hola@blacktrama.studio</a>
        <a href="#" style="color:#0c0c0b;font-size:clamp(16px,1.04vw,20px);display:inline-flex;align-items:center;gap:8px;align-self:flex-start" style-hover="color:#6b6862"><i class="ph-fill ph-whatsapp-logo" aria-hidden="true" style="font-size:1.25em;line-height:1"></i> WhatsApp</a>
      </div>
      <div style="display:flex;gap:clamp(24px,1.7vw,32px);font-size:clamp(15px,0.89vw,17px)">
        <a href="#" style="color:#0c0c0b;display:inline-flex;align-items:center;gap:8px" style-hover="color:#6b6862"><i class="ph-fill ph-instagram-logo" aria-hidden="true" style="font-size:1.25em;line-height:1"></i> Instagram</a>
        <a href="#" style="color:#0c0c0b;display:inline-flex;align-items:center;gap:8px" style-hover="color:#6b6862"><i class="ph-fill ph-behance-logo" aria-hidden="true" style="font-size:1.25em;line-height:1"></i> Behance</a>
      </div>
    </div>
    <div style="{{ footRight }}">
      <div data-line="{{ divAxis }}" aria-hidden="true" style="{{ footDivider }}"><div data-draw="" style="position:absolute;inset:0;background:#0c0c0b;opacity:0.55"></div></div>
      <nav style="display:flex;flex-direction:column;font-size:clamp(32px,2.7vw,52px);line-height:1.15;letter-spacing:-0.02em">
        <a href="trabajos.dc.html" style="color:#0c0c0b;align-self:flex-start" style-hover="color:#6b6862">Trabajo</a>
        <a href="contacto.dc.html" style="color:#0c0c0b;align-self:flex-start;font-style:italic" style-hover="color:#6b6862">Contacto</a>
      </nav>
    </div>
  </div>
  <div style="flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;padding:clamp(24px,2vw,38px) clamp(16px,1.67vw,32px) clamp(28px,2.2vw,40px);font-size:clamp(13px,0.78vw,15px)">
    <div data-line="x" aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:#e3dfd7;pointer-events:none;overflow:hidden"><div data-draw="" style="position:absolute;inset:0;background:#0c0c0b;opacity:0.55"></div></div>
    <span style="color:#7a766f">© 2026 Blacktrama</span>
    <button type="button" onClick="{{ toTop }}" style="background:none;border:0;padding:0;font:inherit;color:#0c0c0b;cursor:pointer;display:inline-flex;align-items:center;gap:6px" style-hover="color:#6b6862">Volver arriba <i class="ph ph-arrow-up" aria-hidden="true" style="font-size:1.1em;line-height:1"></i></button>
  </div>
  <div style="flex-shrink:0;padding:clamp(12px,1.25vw,24px) clamp(16px,1.67vw,32px) clamp(16px,1.8vw,34px);overflow:hidden">
    <div style="width:100%">
      <span ref="{{ wmRef }}" style="display:inline-block;white-space:nowrap;font-size:19.5vw;line-height:0.8;letter-spacing:-0.045em;font-weight:400;padding-bottom:0.02em">Blacktrama</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;grain&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.07,&quot;min&quot;:0,&quot;max&quot;:0.25,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Vintage&quot;},&quot;smooth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.07,&quot;min&quot;:0.03,&quot;max&quot;:0.3,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimiento&quot;}}">
const PJ = [
  ['Clínica Sonrisa', 'Diseño web · Salud', '2026'],
  ['Tienda Norte', 'E-commerce · Moda', '2026'],
  ['Estudio Lumen', 'Diseño web · Arquitectura', '2025'],
  ['Café Ruta', 'Landing page · Gastronomía', '2025'],
  ['Agenda Viva', 'UX/UI · Plataforma', '2025'],
  ['Nodo Finanzas', 'Concepto · Fintech', '2025'],
  ['Hotel Brisa', 'Diseño web · Hotelería', '2025'],
  ['Taller Barro', 'E-commerce · Cerámica', '2024'],
  ['Pulso Fit', 'UX/UI · App de entrenamiento', '2024'],
  ['Ruta Andina', 'Diseño web · Turismo', '2024'],
  ['Casa Olivo', 'Landing page · Inmobiliaria', '2024'],
  ['Lab Verde', 'Diseño web · Ciencia', '2024'],
  ['Mercado Sur', 'E-commerce · Alimentos', '2023'],
  ['Faro Legal', 'Diseño web · Abogados', '2023'],
  ['Sello Eco', 'Concepto · Música', '2023'],
];
const TONES = ['#3a3a39', '#4a4a45', '#3f3e3a', '#45443f', '#383836'];
const SEG = 0.6;
const slugify = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '-');
const EIO = 'cubic-bezier(0.7, 0, 0.2, 1)', EOUT = 'cubic-bezier(0.22, 1, 0.36, 1)';

const PAGE_TRANSITIONS = true; // blur entre páginas + tarjeta→case study (desactivado por ahora)
class Component extends DCLogic {
  state = {
    w: typeof window !== 'undefined' ? window.innerWidth : 1920,
    view: typeof window !== 'undefined' && new URLSearchParams(window.location.search).get('v') === 'lista' ? 'lista' : 'proyectos',
  };
  contentRef = React.createRef(); trackRef = React.createRef(); cardsRef = React.createRef(); namesRef = React.createRef();
  metasRef = React.createRef(); countRef = React.createRef(); listRef = React.createRef();
  cursorRef = React.createRef(); previewRef = React.createRef(); footRef = React.createRef(); wmRef = React.createRef();
  idx = 0; anims = []; mx = -200; my = -200; cx = -200; cy = -200; cs = 0; px = -400; py = -400; ps = 0; cursorOn = false; prevOn = false;
  onResize = () => this.setState({ w: window.innerWidth });
  onMove = (e) => { this.mx = e.clientX; this.my = e.clientY; };

  /* page transitions */
  initPageTransitions() {
    const qs = new URLSearchParams(location.search);
    const fromNav = this.enterFromNav();
    if (!fromNav && qs.get('from') !== 'card' && document.body.animate) document.body.animate([{ filter: 'blur(16px)', opacity: 0, transform: 'scale(1.01)' }, { filter: 'blur(6px)', opacity: 1, offset: 0.45 }, { filter: 'blur(0px)', opacity: 1, transform: 'none' }], { duration: 1100, easing: EOUT });
    this.onPageShow = (e) => { if (e.persisted) { this.leaving = false; document.body.getAnimations().forEach(a => a.cancel()); document.querySelectorAll('[data-bt-overlay]').forEach(n => n.remove()); document.documentElement.classList.remove('bt-busy'); this.spin = null; document.querySelectorAll('[data-bt-overlay]').forEach(n => n.remove()); } };
    window.addEventListener('pageshow', this.onPageShow);
    this.onLinkClick = (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href]'); if (!a || a.target === '_blank') return;
      const raw = a.getAttribute('href'); if (!raw || raw.startsWith('#') || /^(mailto|tel):/.test(raw)) return;
      const url = new URL(raw, location.href); if (url.origin !== location.origin) return;
      e.preventDefault();
      if (url.pathname === location.pathname && url.search === location.search) {
        const t = url.hash && document.querySelector(url.hash);
        if (this.lenis) this.lenis.scrollTo(t || 0); else window.scrollTo({ top: t ? t.getBoundingClientRect().top + scrollY : 0, behavior: 'smooth' });
        return;
      }
      const img = a.querySelector('[data-card-img],[data-rv-img]');
      if (img) this.expandTo(img, url); else this.leave(url.href, !!a.closest('footer'));
    };
    document.addEventListener('click', this.onLinkClick);
    this.onPt = (e) => { this.ptX = e.clientX; this.ptY = e.clientY; if (this.spin) this.spin.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)'; };
    document.addEventListener('pointermove', this.onPt, { passive: true }); document.addEventListener('pointerdown', this.onPt, { passive: true });
    this.onOver = (e) => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a || a.target === '_blank') return;
      const raw = a.getAttribute('href'); if (!raw || raw.startsWith('#') || /^(mailto|tel):/.test(raw)) return;
      const url = new URL(raw, location.href); if (url.origin !== location.origin || url.pathname === location.pathname) return;
      url.hash = ''; this.prefetch(url.href);
    };
    document.addEventListener('pointerover', this.onOver, { passive: true });
    const idle = window.requestIdleCallback || ((f) => setTimeout(f, 1200));
    idle(() => ['index', 'trabajos', 'proyecto', 'contacto'].forEach(p => { const u = new URL(p + '.dc.html', location.href); if (u.pathname !== location.pathname) this.prefetch(u.href); }));
  }
  prefetch(href) {
    this.pf = this.pf || {};
    if (!this.pf[href]) this.pf[href] = fetch(href, { credentials: 'same-origin' }).then(r => r.text()).catch(() => {});
    return this.pf[href];
  }
  ready(href) {
    return Promise.race([this.prefetch(href), new Promise(r => setTimeout(r, 2500))]).then(() => new Promise(r => requestAnimationFrame(() => r())));
  }
  busy(dark) {
    if (this.spin) return;
    document.documentElement.classList.add('bt-busy');
    const c = dark ? '#0c0c0b' : '#ece8e1';
    const s = document.createElement('div'); s.setAttribute('data-bt-overlay', '');
    s.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;z-index:100000;pointer-events:none;transform:translate3d(' + (this.ptX ?? innerWidth / 2) + 'px,' + (this.ptY ?? innerHeight / 2) + 'px,0)';
    const r = document.createElement('div');
    r.style.cssText = 'position:absolute;left:-11px;top:-11px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px solid ' + c + ';border-right-color:transparent';
    s.appendChild(r); document.documentElement.appendChild(s);
    r.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 700, iterations: Infinity });
    this.spin = s;
  }
  blurLayer(px) {
    const ov = document.createElement('div'); ov.setAttribute('data-bt-overlay', '');
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;pointer-events:none;backdrop-filter:blur(' + px + 'px);-webkit-backdrop-filter:blur(' + px + 'px)';
    document.documentElement.appendChild(ov); return ov;
  }
  enterFromNav() {
    const de = document.documentElement; if (!de.classList.contains('bt-in')) return false;
    const ov = this.blurLayer(14); de.classList.remove('bt-in');
    const a = ov.animate([{ backdropFilter: 'blur(14px)' }, { backdropFilter: 'blur(0px)' }], { duration: 1000, delay: 60, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' });
    a.onfinish = () => ov.remove();
    return true;
  }
  leave(href, dark) {
    if (this.leaving) return; this.leaving = true;
    const st = setTimeout(() => this.busy(dark), 160);
    this.ready(href).then(() => {
      if (!this.spin) clearTimeout(st);
      const ov = this.blurLayer(0); ov.style.pointerEvents = 'auto';
      ov.animate([{ backdropFilter: 'blur(0px)' }, { backdropFilter: 'blur(14px)' }], { duration: 480, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'forwards' }).onfinish = () => {
        try { sessionStorage.setItem('bt-nav', '1'); } catch (e) {}
        location.href = href;
      };
    });
  }
  expandTo(el, url) { this.leave(url.href, false); }
  expandCard(el, url) {
    if (this.leaving) return; this.leaving = true;
    if (this.cursorRef && this.cursorRef.current) this.cursorOn = false;
    const st = setTimeout(() => this.busy(false), 160);
    this.ready(url.href).then(() => { if (!this.spin) clearTimeout(st); this.leaving = false; this.expandNow(el, url); });
  }
  expandNow(el, url) {
    if (this.leaving) return; this.leaving = true;
    const r = el.getBoundingClientRect(), bg = getComputedStyle(el).backgroundColor;
    url.searchParams.set('from', 'card'); url.searchParams.set('c', bg);
    const ov = document.createElement('div'); ov.setAttribute('data-bt-overlay', '');
    ov.style.cssText = `position:fixed;z-index:9999;pointer-events:none;background:${bg};left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    document.body.appendChild(ov);
    if (this.cursorRef.current) this.cursorOn = false;
    ov.animate([
      { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' },
      { left: '0px', top: '0px', width: innerWidth + 'px', height: innerHeight + 'px' },
    ], { duration: 850, easing: EIO, fill: 'forwards' }).onfinish = () => { location.href = url.href; };
  }

  /* proyectos stage */
  fitNames = () => {
    const box = document.querySelector('[data-names]'); if (!box) return;
    box.style.fontSize = '100px';
    const lines = [...box.querySelectorAll('[data-name]')]; if (!lines.length) return;
    const maxW = Math.max(...lines.map(l => l.scrollWidth));
    const pad = Math.max(16, innerWidth * 0.02);
    if (maxW > 0) box.style.fontSize = Math.min(360, (100 * (box.clientWidth - pad * 2) / maxW)).toFixed(2) + 'px';
    const card = document.querySelector('[data-cardbox]');
    if (!card) return;
    if (innerWidth < 768) { card.style.height = ''; card.style.marginLeft = ''; return; }
    const fs = parseFloat(box.style.fontSize) || 200;
    const capTop = box.offsetTop + fs * 0.2, overlap = fs * 0.07;
    const hgt = Math.max(240, Math.min(innerHeight * 0.78, capTop + overlap - card.offsetTop));
    card.style.height = hgt.toFixed(1) + 'px';
    card.style.marginLeft = (-hgt * 0.375).toFixed(1) + 'px';
  };
  segY(j) { const t = document.querySelector('[data-track]'); return t ? t.getBoundingClientRect().top + window.scrollY + j * SEG * innerHeight : 0; }
  step(dir) {
    const j = Math.max(0, Math.min(PJ.length - 1, this.idx + dir)); if (j === this.idx) return;
    this.lockUntil = performance.now() + 550;
    const y = this.segY(j);
    if (this.lenis) this.lenis.scrollTo(y, { immediate: true }); else window.scrollTo(0, y);
    if (j === PJ.length - 1 && dir > 0) { this.holdLast = true; this.holdUntil = performance.now() + 350; } else this.holdLast = false;
    this.goTo(j);
  }
  onWheel = (e) => {
    if (this.state.view !== 'proyectos') return;

        : { display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: '48px', padding: 'clamp(32px,2vw,40px) ' + P + ' clamp(24px,1.6vw,28px)' },
      footRight: mobile
        ? { position: 'relative', padding: '40px ' + P + ' 56px' }
        : { position: 'relative', padding: 'clamp(28px,1.8vw,36px) ' + P },
    };
  }
}
</script>
</body>
</html>
